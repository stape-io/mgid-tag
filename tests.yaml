setup: |-
  const JSON = require('JSON');
  const Promise = require('Promise');
  const callLater = require('callLater');
  const assign = (target, source) => {
      if (!source) return target;
      for (const key in source) {
        target[key] = source[key];
      }
      return target;
    };
  const createMockData = (overrides) => {
    return assign({
      clientId: 'client123', // Fixed: Matches parameter 'clientId'
      eventName: 'event_name',
      revenue: '1',
      cookieExpiration: 365,
      cookieDomain: 'auto',
      cookieSameSite: 'none',
      cookieHttpOnly: false,
    }, overrides);
  };

  const mockData = createMockData();
  mock('getRequestHeader', (header) => {
  if(header === 'referer') return 'http://referer.com';
  if(header === 'trace-id') return 'trace_id_123';
  });
  mock('getAllEventData', () => (
     {
    'page_location': 'https://example.com'
  }));
  mock('getEventData', () => undefined);
  mock('getCookieValues', () => []);
  mock('setCookie', () => {});
  mock('computeEffectiveTldPlusOne', () => 'example.com');
  mock('sendHttpRequest', (url, options, body) => {
    return Promise.create((resolve) => resolve({ statusCode: 200, body: '' }));
  });

scenarios:
  - name: '[Early Exit] Calls gtmOnSuccess and stops when consent is required but not
      given'
    code: |-
      mockData.type = 'pageview';
      mockData.adStorageConsent = 'required';
      mock('getAllEventData', () => ({
        page_location: 'https://example.com/?adclid=123',
        'x-ga-gcs': 'G100'
      }));
      runCode(mockData);
      assertApi('sendHttpRequest').wasNotCalled();
      assertApi('gtmOnSuccess').wasCalled();
      assertApi('gtmOnFailure').wasNotCalled();
  - name: '[Early Exit] Proceeds normally when required consent is given'
    code: |-
      [
        { 'x-ga-gcs': 'G110' },
        { consent_state: { ad_storage: true } }
      ].forEach((consentEventData) => {
        mockData.type = 'pageview';
        mockData.adStorageConsent = 'required';
        mock('getAllEventData', () => (
          assign({ page_location: 'https://example.com/?adclid=123' }, consentEventData)
        ));
        mock('setCookie', () => {});
        runCode(mockData);
        assertApi('setCookie').wasCalled();
        assertApi('gtmOnSuccess').wasCalled();
        assertApi('gtmOnFailure').wasNotCalled();
      });
  - name: '[Early Exit] Consent check is skipped when adStorageConsent is optional'
    code: |-
      mockData.type = 'conversion';
      mockData.adStorageConsent = 'optional';
      mock('getAllEventData', () => ({
        page_location: 'https://example.com/',
        referrer: 'https://referrer.com/',
        'x-ga-gcs': 'G100'
      }));
      mock('getCookieValues', () => (['123']));
      mock('sendHttpRequest', (url, options, body) => {
        return Promise.create((resolve) => resolve({ statusCode: 200, body: '' }));
      });
      runCode(mockData);
      callLater(() => {
        assertApi('sendHttpRequest').wasCalled();
        assertApi('gtmOnSuccess').wasCalled();
        assertApi('gtmOnFailure').wasNotCalled();
      });
  - name: '[Early Exit] Calls gtmOnSuccess and stops when URL matches the GTM preview
      endpoint'
    code: |-
      mockData.type = 'pageview';
      mock('getAllEventData', () => ({
        page_location: 'https://gtm-msr.appspot.com/collect?adclid=123'
      }));
      runCode(mockData);
      assertApi('sendHttpRequest').wasNotCalled();
      assertApi('gtmOnSuccess').wasCalled();
      assertApi('gtmOnFailure').wasNotCalled();
  - name: '[Page View] Calls gtmOnSuccess and doesnt set cookie when no click id is
      found'
    code: |-
      mockData.type = 'pageview';
      mock('getAllEventData', () => ({
        page_location: 'https://example.com/no-click-id-here'
      }));
      runCode(mockData);
      assertApi('sendHttpRequest').wasNotCalled();
      assertApi('setCookie').wasNotCalled();
      assertApi('gtmOnSuccess').wasCalled();
      assertApi('gtmOnFailure').wasNotCalled();
  - name: '[Page View] Stores click id read from the aliased query parameter (adclida)'
    code: |-
      mockData.type = 'pageview';
      mock('getAllEventData', () => ({
        page_location: 'https://example.com/?adclida=my_click_id&my_click_id=abc123'
      }));
      let storedClickId;
      mock('setCookie', (name, value) => {
        storedClickId = value;
      });
      runCode(mockData);
      assertThat(storedClickId).isEqualTo('abc123');
      assertApi('gtmOnSuccess').wasCalled();
      assertApi('gtmOnFailure').wasNotCalled();
  - name: '[Page View] Does not crash when a URL source is malformed and still finds
      the click id from another source'
    code: |-
      mockData.type = 'pageview';
      mock('getAllEventData', () => ({
        page_location: 'not-a-valid-url',
        page_referrer: 'https://example.com/?adclid=abc123'
      }));
      let storedClickId;
      mock('setCookie', (name, value) => {
        storedClickId = value;
      });
      runCode(mockData);
      assertThat(storedClickId).isEqualTo('abc123');
      assertApi('gtmOnSuccess').wasCalled();
      assertApi('gtmOnFailure').wasNotCalled();
  - name: '[Page View] Ignores a repeated adclid query parameter instead of using
      it as-is'
    code: |-
      mockData.type = 'pageview';
      mock('getAllEventData', () => ({
        page_location: 'https://example.com/?adclid=a&adclid=b'
      }));
      runCode(mockData);
      assertApi('setCookie').wasNotCalled();
      assertApi('gtmOnSuccess').wasCalled();
      assertApi('gtmOnFailure').wasNotCalled();
  - name: '[Page View] Stores the click id cookie using the configured domain sameSite
      httpOnly and expiration'
    code: |-
      mockData.type = 'pageview';
      mockData.cookieDomain = 'example.com';
      mockData.cookieSameSite = 'strict';
      mockData.cookieHttpOnly = true;
      mockData.cookieExpiration = 7;
      mock('getAllEventData', () => ({
        page_location: 'https://example.com/?adclid=123'
      }));
      let capturedOptions;
      mock('setCookie', (name, value, options) => {
        capturedOptions = options;
      });
      runCode(mockData);
      callLater(() => {
        assertThat(capturedOptions.domain).isEqualTo('example.com');
        assertThat(capturedOptions.samesite).isEqualTo('strict');
        assertThat(capturedOptions.httpOnly).isTrue();
        assertThat(capturedOptions.secure).isTrue();
        assertThat(capturedOptions['max-age']).isEqualTo(60 * 60 * 24 * 7);
        assertApi('sendHttpRequest').wasNotCalled();
        assertApi('gtmOnSuccess').wasCalled();
        assertApi('gtmOnFailure').wasNotCalled();
      });
  - name: '[Conversion] Sends conversion postback request with clientId, eventName, clickId, revenue'
    code: |-
      mockData.type = 'conversion';
      mockData.clientId = 'test_client';
      mockData.eventName = 'purchase';
      mockData.clickId = 'test_click_id';
      mockData.revenue = '150.50';
      let sentUrl;
      mock('sendHttpRequest', (url) => {
        sentUrl = url;
        return Promise.create((resolve) => resolve({ statusCode: 200, body: '' }));
      });
      runCode(mockData);
      callLater(() => {
        assertApi('sendHttpRequest').wasCalled();
        assertThat(sentUrl).isEqualTo('https://a.mgid.com/postback/test_client?c=test_click_id&e=purchase&r=150.50&m=stape-sgtm');
        assertApi('gtmOnSuccess').wasCalled();
      });
  - name: '[Conversion] Omits revenue from URL when revenue is not provided'
    code: |-
      mockData.type = 'conversion';
      mockData.clientId = 'test_client';
      mockData.eventName = 'lead';
      mockData.clickId = 'test_click_id';
      mockData.revenue = undefined;
      let sentUrl;
      mock('sendHttpRequest', (url) => {
        sentUrl = url;
        return Promise.create((resolve) => resolve({ statusCode: 200, body: '' }));
      });
      runCode(mockData);
      callLater(() => {
        assertApi('sendHttpRequest').wasCalled();
        assertThat(sentUrl).isEqualTo('https://a.mgid.com/postback/test_client?c=test_click_id&e=lead&m=stape-sgtm');
        assertApi('gtmOnSuccess').wasCalled();
      });
  - name: '[Conversion] Calls gtmOnFailure without sending a request when a required
      parameter is missing'
    code: |-
      mock('getCookieValues', () => ([]));
      [
        { clientId: undefined, eventName: 'purchase', clickId: 'id1' },
        { clientId: 'test_client', eventName: undefined, clickId: 'id1' },
        { clientId: 'test_client', eventName: 'purchase', clickId: undefined }
      ].forEach((overrides) => {
        const copyMockData = createMockData(assign({ type: 'conversion' }, overrides));
        runCode(copyMockData);
        assertApi('sendHttpRequest').wasNotCalled();
        assertApi('gtmOnSuccess').wasNotCalled();
        assertApi('gtmOnFailure').wasCalled();
      });
  - name: '[Conversion] Calls gtmOnFailure for non-2xx responses and promise rejection'
    code: |-
      [{ mockResponse: (resolve, reject) => resolve({ statusCode: 400, body: '' }) },
       { mockResponse: (resolve, reject) => reject() }
      ].forEach((scenario) => {
        const copyMockData = createMockData({
          type: 'conversion',
          clientId: 'test_client',
          eventName: 'purchase',
          revenue: '100'
        });
        mock('getCookieValues', () => (['123']));
        mock('sendHttpRequest', (url, options, body) => {
          return Promise.create(scenario.mockResponse);
        });
        runCode(copyMockData);
        callLater(() => {
          assertApi('sendHttpRequest').wasCalled();
          assertApi('gtmOnSuccess').wasNotCalled();
          assertApi('gtmOnFailure').wasCalled();
        });
      });
  - name: '[Conversion] Optimistic scenario calls gtmOnSuccess immediately and does
      not also call gtmOnFailure when the request later fails'
    code: |-
      mockData.type = 'conversion';
      mockData.useOptimisticScenario = true;
      mock('getCookieValues', () => (['123']));
      mock('sendHttpRequest', (url, options, body) => {
        return Promise.create((resolve) => resolve({ statusCode: 500, body: '' }));
      });
      runCode(mockData);
      assertApi('gtmOnSuccess').wasCalled();
      assertApi('gtmOnFailure').wasNotCalled();
      callLater(() => {
        assertApi('gtmOnSuccess').wasCalled();
        assertApi('gtmOnFailure').wasNotCalled();
      });
